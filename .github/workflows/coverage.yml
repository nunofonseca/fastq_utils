name: Coverage to Codecov

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget bzip2 libbz2-dev liblzma-dev libncurses-dev

      - name: Build dependencies
        run: ./install_deps.sh

      - name: Build with coverage
        run: |
          DO_COV_TEST=1 make
          DO_COV_TEST=1 make install

      - name: Run tests
        run: |
          export PATH="$PWD/bin:$PATH"
          make tests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: src
          fail_ci_if_error: true